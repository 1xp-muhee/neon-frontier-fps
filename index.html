<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>Neon Frontier — FPS Training</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameShell">
    <canvas id="game" aria-label="Neon Frontier FPS game"></canvas>
    <div id="hud" aria-live="polite">
      <div class="brand"><span>NEON</span> FRONTIER <small>TRAINING RANGE</small></div>
      <div class="statbar"><div><b id="score">0000</b><span>SCORE</span></div><div><b id="timer">60.0</b><span>TIME</span></div><div><b id="health">100</b><span>SHIELD</span></div></div>
      <div class="crosshair"><i></i><i></i><i></i><i></i><em></em></div>
      <div id="damage"></div>
      <div id="message" class="message">CLICK TO DEPLOY</div>
      <div class="help">WASD MOVE · MOUSE AIM · CLICK FIRE · R RESTART</div>
      <div id="mobileControls" aria-label="Mobile controls">
        <div id="joystick" aria-label="Move"><i></i></div>
        <button id="fireButton" aria-label="Fire">FIRE</button>
      </div>
    </div>
    <section id="intro">
      <p class="eyebrow">SIMULATION // 01</p>
      <h1>NEON<br><strong>FRONTIER</strong></h1>
      <p>60초 안에 드론을 격추하세요.<br>드론과 충돌하면 쉴드가 줄어듭니다.</p>
      <button id="startButton">훈련 시작</button>
      <small>WASD 이동 · 마우스 조준 · 클릭 발사</small>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
